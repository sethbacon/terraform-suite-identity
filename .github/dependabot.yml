version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      # "biweekly" is not a valid Dependabot interval (allowed: daily, weekly,
      # monthly, quarterly, semiannually, yearly, cron) — this file was failing
      # GitHub's dependabot.yml schema validation. Standard cron has no native
      # "every 2 weeks" construct either, so weekly is the closest valid cadence.
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-dependencies:
        patterns:
          - "*"
        # Security-sensitive direct dependencies are excluded from the catch-all
        # group so a CVE fix for one of them can merge and be reviewed on its own,
        # rather than riding along with (and being reviewed no more carefully
        # than) unrelated routine version bumps in the same combined PR.
        exclude-patterns:
          - "github.com/coreos/go-oidc/*"
          - "github.com/golang-jwt/jwt/*"
          - "golang.org/x/crypto"
          - "golang.org/x/oauth2"
          - "golang.org/x/net"
          # SQL driver and migration engine (see reopened issue #68): these sit
          # on the same high-stakes surface (migration/schema safety) as the
          # auth-adjacent deps above, so their version bumps get individual
          # review too instead of riding the batched catch-all group.
          - "github.com/lib/pq"
          - "github.com/golang-migrate/migrate/*"
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # npm (.github/commit-message-check: the parser the PR gate shares with
  # release-please)
  # ---------------------------------------------------------------------------
  # The gate is only meaningful while it parses the way release-please does, so
  # these bumps want checking against release-please's own dependency rather
  # than merging on green.
  - package-ecosystem: npm
    directory: /.github/commit-message-check
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    groups:
      commit-message-check:
        patterns:
          - "*"
    # zizmor dependabot-cooldown: the implicit default is 3 days and the audit
    # requires 7. Security updates are exempt from cooldown, so this delays
    # feature bumps and not fixes.
    cooldown:
      default-days: 7
