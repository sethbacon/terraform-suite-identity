name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Independent of Dependabot's own weekly cadence: this re-scan runs on a
    # separate schedule so a CVE disclosed against an already-fetched,
    # checksum-valid dependency doesn't sit undetected between Dependabot runs.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go.mod or go.sum is out of date — run 'go mod tidy' and commit the result"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (with coverage)
        # auth/models/store are unit-tested (sqlmock for the data layer — no live
        # DB needed). The migration runner (identity.RunMigrations) requires a
        # live PostgreSQL and is deliberately NOT run here — it's exercised by
        # the "integration-test" job below (identity/db_integration_test.go,
        # built with -tags=integration), which is excluded from this plain
        # `go test ./...` run.
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage threshold
        run: |
          THRESHOLD=75
          COVERAGE=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%  (threshold: ${THRESHOLD}%)"
          awk -v cov="$COVERAGE" -v thr="$THRESHOLD" 'BEGIN {
            if (cov + 0 < thr + 0) {
              print "FAIL: " cov "% is below the " thr "% minimum threshold."
              exit 1
            }
            print "PASS: " cov "% meets the " thr "% threshold."
          }'

      - name: Check per-package coverage floor (derived — every package gated by default)
        # The aggregate 75% floor above can hide a low-coverage security-critical
        # package behind easy-to-cover CRUD/model packages (issue #66: this once
        # let identity/auth/oidc sit at ~53% while the blended total looked fine).
        #
        # The package set is DERIVED from the coverage profile, not hand-listed.
        # An opt-in list of "security-critical packages" is the same control gap
        # one level up: it is maintained by hand, so a newly added package is
        # ungated until someone remembers to add it — which is precisely how
        # identity/auth/oidc slid, and then how identity/mailer (the outbound
        # SMTP transport, whose entire reason for existing is getting TLS
        # negotiation right) sat at 61.9% while never appearing in the list at
        # all. Every package that appears in the profile is therefore gated
        # unless it is explicitly EXEMPT below with a written justification.
        #
        # Reuses the coverage.out profile the "Test (with coverage)" step already
        # produced (no re-running tests, no new tooling — stdlib python3,
        # preinstalled on ubuntu-latest).
        run: |
          python3 - <<'PY'
          import sys
          from collections import defaultdict

          THRESHOLD = 75.0
          MODULE_PREFIX = "github.com/sethbacon/terraform-suite-identity/"

          # Packages exempt from the per-package floor, each with the reason it
          # cannot be gated here. Adding an entry is a deliberate, reviewable act
          # (this file is CODEOWNER-gated); forgetting to add one is not, which
          # is why the default is "gated".
          EXEMPT = {
              "identity": (
                  "migration runner (RunMigrations/GetMigrationVersion): requires a "
                  "live PostgreSQL, so it cannot be covered by this unit-test job. "
                  "It is exercised by the required 'Integration Tests (PostgreSQL)' "
                  "job instead (identity/db_integration_test.go, -tags=integration)."
              ),
          }

          covered = defaultdict(int)
          total = defaultdict(int)

          with open("coverage.out") as f:
              next(f, None)  # skip the "mode: ..." header line
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  # Profile line format:
                  # "<file>:<startline>.<col>,<endline>.<col> <numstmt> <count>"
                  location, numstmt_str, count_str = line.rsplit(" ", 2)
                  file_path = location.split(":", 1)[0]
                  if not file_path.startswith(MODULE_PREFIX):
                      continue
                  rel_path = file_path[len(MODULE_PREFIX):]
                  pkg = rel_path.rsplit("/", 1)[0] if "/" in rel_path else rel_path
                  total[pkg] += int(numstmt_str)
                  if int(count_str) > 0:
                      covered[pkg] += int(numstmt_str)

          if not total:
              print("FAIL: coverage.out contained no statements for this module — "
                    "the coverage gate would pass vacuously.")
              sys.exit(1)

          # A stale exemption is itself an ungated package waiting to happen:
          # if an exempt package is renamed or removed, the entry must not
          # silently linger and pre-authorize a future package of that name.
          stale = sorted(set(EXEMPT) - set(total))
          if stale:
              print("FAIL: EXEMPT lists package(s) not present in the coverage profile; "
                    "remove the stale entr(y/ies) so they cannot silently pre-exempt "
                    "a future package of the same name:")
              for pkg in stale:
                  print(f"  - {pkg}")
              sys.exit(1)

          failed = []
          for pkg in sorted(total):
              stmt_total = total[pkg]
              pct = covered.get(pkg, 0) * 100.0 / stmt_total
              if pkg in EXEMPT:
                  print(f"EXEMPT: {pkg} coverage {pct:.1f}% — {EXEMPT[pkg]}")
                  continue
              if stmt_total == 0:
                  print(f"SKIP: {pkg} has no statements to cover")
                  continue
              status = "PASS" if pct >= THRESHOLD else "FAIL"
              cmp = ">=" if pct >= THRESHOLD else "<"
              print(f"{status}: {pkg} coverage {pct:.1f}% ({cmp} {THRESHOLD:.0f}% required floor)")
              if pct < THRESHOLD:
                  failed.append((pkg, pct))

          if failed:
              print()
              print("One or more packages are below the per-package coverage floor:")
              for pkg, pct in failed:
                  print(f"  - {pkg}: {pct:.1f}% < {THRESHOLD:.0f}%")
              print()
              print("Raise the package's coverage. Do not lower THRESHOLD, and do not "
                    "add an EXEMPT entry unless the package genuinely cannot be "
                    "exercised by this job (and is gated by another required job).")
              sys.exit(1)

          print()
          print(f"All {len(total) - len(EXEMPT)} gated package(s) meet the "
                f"{THRESHOLD:.0f}% per-package coverage floor.")
          PY

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.out

  integration-test:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: identity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run migration integration tests
        # A separate job (not a step in "test" above) on purpose: it needs its
        # own postgres service container, and keeping it independent means a
        # slow DB-backed job never slows the fast unit-test feedback loop. The
        # "integration" build tag keeps this test out of every plain
        # `go test ./...` invocation (this job is the only place it runs). See
        # identity/db_integration_test.go.
        #
        # This step is deliberately NOT continue-on-error, and this job is a
        # required status check on main (issue #140). It is the only place the
        # migration runner is exercised against a real PostgreSQL, and both
        # consuming applications call RunMigrations at startup, so a migration
        # defect that does not fail here fails a live deploy instead — with no
        # Force/recovery entry point in identity/db.go to clear the dirty state
        # a partially applied migration leaves behind. A non-blocking migration
        # gate is the same as no migration gate.
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/identity_test?sslmode=disable
        run: go test -tags=integration ./... -run TestIntegrationRunMigrations -v

  gosec:
    name: Security Scan (gosec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run gosec
        # The module is small; fail on any finding. Suppress accepted risks inline
        # with // #nosec <rule> -- <justification> if they arise.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.26.1
          export PATH="$PATH:$(go env GOPATH)/bin"
          gosec ./...

  govulncheck:
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        # Reachability-aware scan of the Go vulnerability database against the
        # currently pinned go.sum versions. Runs on every push/PR AND weekly via
        # the schedule trigger above, independent of Dependabot's cadence.
        #
        # The scanner binary is version-pinned (like gosec above) rather than
        # installed from @latest: an unpinned scanner is an unreviewed
        # third-party binary executing in CI on every run, and pinning it costs
        # nothing in freshness — govulncheck fetches the vulnerability database
        # at runtime, so a pinned binary still reports newly disclosed
        # advisories. Dependabot does not bump this pin (it is not a module
        # dependency); refresh it deliberately.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          export PATH="$PATH:$(go env GOPATH)/bin"
          govulncheck ./...
