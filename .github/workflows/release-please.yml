name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      # Uses the default GITHUB_TOKEN for now. If this repo's release PRs need to
      # trigger CI, install the suite's release GitHub App here and switch to
      # actions/create-github-app-token (as the registry / state-manager do).
      - name: Run release-please
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
