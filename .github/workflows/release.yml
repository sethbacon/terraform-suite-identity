name: Release

# Publishes the GitHub Release for a semver tag.
#
# release-please (.github/workflows/release-please.yml) creates the tag and a
# DRAFT release with the changelog when its release PR is merged ("draft": true
# in .release-please-config.json). The resulting tag push triggers this workflow,
# which publishes that draft. This mirrors the registry's two-stage release flow;
# the registry also builds binaries + a Docker image here, but this is a pure Go
# library with no artifacts to attach, so the job only flips the draft to
# published.
#
# To publish an already-tagged version manually (e.g. a tag created before this
# workflow existed):  gh workflow run release.yml --ref vX.Y.Z
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Releases must originate from main: verify the tagged commit is reachable
  # from origin/main before publishing (GitHub can't filter tag events by branch).
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0 # full history to walk ancestry
      - name: Check tagged commit is reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must be on main." \
                 "This ref points to a commit that is not in origin/main."
            exit 1
          fi
          echo "✅ Tag is on main — proceeding with release."

  publish-release:
    name: Publish GitHub Release
    needs: guard
    runs-on: ubuntu-latest
    # Deployment approval gate, mirroring terraform-suite-ui's publish flow: the
    # "release" environment (Settings > Environments) requires reviewer approval
    # and restricts deployments to v* tags before this privileged job runs.
    environment: release
    permissions:
      contents: write # publish / create releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Publish the release-please draft (or create it if absent)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"

          # Fully anchored (note the trailing '$'): without it, a tag such as
          # 'v1.2.3-<arbitrary text>' passes validation and its suffix reaches
          # the changelog-extraction step below. Optional pre-release/build
          # metadata is allowed, but only from a restricted character set.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::This workflow must run on a semver tag (got '${TAG}')." \
                 "Use: gh workflow run release.yml --ref vX.Y.Z"
            exit 1
          fi

          if gh release view "${TAG}" --repo "${REPO}" > /dev/null 2>&1; then
            echo "Release ${TAG} exists (draft from release-please) — publishing."
            gh release edit "${TAG}" --repo "${REPO}" --draft=false
          else
            echo "No release for ${TAG} — creating from CHANGELOG.md."
            # Extract this version's changelog section by LITERAL string match.
            # The version is passed through the environment and compared with
            # awk's index(), never spliced into a regex or an address range, so
            # the tag cannot influence the structure of the matching program
            # (the previous implementation built a sed address range from it).
            CHANGELOG_BODY="$(VERSION="${TAG#v}" awk '
              BEGIN { want = "## [" ENVIRON["VERSION"] "]"; in_section = 0 }
              index($0, "## [") == 1 {
                if (in_section) { exit }
                if (index($0, want) == 1) { in_section = 1; next }
              }
              in_section { print }
            ' CHANGELOG.md)"
            gh release create "${TAG}" \
              --repo "${REPO}" \
              --title "${TAG}" \
              --notes "${CHANGELOG_BODY}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
